id: task-a-repo-understanding
category: repository-understanding
title: Locate and Trace Rate Limiting Implementation
difficulty: medium
pinnedCommit: 96453c8
environment: node22-isolated
timeoutSec: 300
tokenBudget: 50000
description: >
  In an unfamiliar service codebase, trace the execution path of the rate limiter
  from incoming HTTP header parsing down to the storage backend. Identify the exact
  file and line where headers are normalized and report the dependency topology.
