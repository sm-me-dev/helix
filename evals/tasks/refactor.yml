id: refactor
title: Move limiter-class stamping into RequestContext
prompt: >
  Limiter-class logic is split between auth.ts and rate-limit.ts in a way
  that cookie sessions and API keys cannot share. Consolidate the
  limiterClass decision in src/context.ts so both auth paths share it.
  No behavior change: the currently passing tests must stay green, and no
  new behavior may be added.
pass: node --experimental-strip-types --test tests/context.test.ts tests/billing.test.ts
timeoutSec: 600
