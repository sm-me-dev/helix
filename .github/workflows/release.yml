name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify quality gates
        run: |
          npm run lint
          npm run typecheck
          npm test

  package-and-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Build release archives
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Packaging release: ${TAG}"

          # Create distribution staging directory
          mkdir -p dist/package
          cp -r cli src package.json LICENSE README.md dist/package/

          # Create tar.gz and zip archives
          tar -czf "dist/helix-${TAG}.tar.gz" -C dist/package .
          (cd dist/package && zip -r "../../dist/helix-${TAG}.zip" .)

          # Generate SHA-256 checksums
          (cd dist && sha256sum helix-${TAG}.* > SHA256SUMS.txt)

      - name: Validate distribution artifact integrity
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Verify checksums
          (cd dist && sha256sum --check SHA256SUMS.txt)

          # Smoke test extracted artifact in isolated environment
          mkdir -p test-install
          tar -xzf "dist/helix-${TAG}.tar.gz" -C test-install
          cd test-install
          npm install --omit=dev --ignore-scripts --no-audit --no-fund
          node cli/helix.mjs --version
          node cli/helix.mjs --help
          node cli/helix.mjs run "Smoke test from release archive" --dry

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          awk "/^## \[${TAG#v}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "${TAG}" \
              dist/helix-${TAG}.tar.gz \
              dist/helix-${TAG}.zip \
              dist/SHA256SUMS.txt \
              --title "Helix ${TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" \
              dist/helix-${TAG}.tar.gz \
              dist/helix-${TAG}.zip \
              dist/SHA256SUMS.txt \
              --title "Helix ${TAG}" \
              --generate-notes
          fi
