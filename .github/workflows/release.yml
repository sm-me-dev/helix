name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify quality gates
        run: |
          npm run lint
          npm run typecheck
          npm test
          node --test scripts/doc-paths.test.mjs
          node --experimental-strip-types --test src/platforms.test.ts

  package-and-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install dependencies & packaging utilities
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm dpkg zip

      - name: Compile ES modules distribution
        run: node scripts/build.mjs

      - name: Build standalone platform bundles
        run: node scripts/build-bundles.mjs all

      - name: Build Debian packages
        run: |
          ./scripts/build-deb.sh amd64
          ./scripts/build-deb.sh arm64

      - name: Build RPM packages
        run: |
          ./scripts/build-rpm.sh x86_64

      - name: Build source distribution archives
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Packaging source archive: ${TAG}"
          mkdir -p dist/packages
          tar -czf "dist/packages/helix-${TAG}-source.tar.gz" --exclude=".git" --exclude="node_modules" --exclude="dist" .
          zip -rq "dist/packages/helix-${TAG}-source.zip" . -x "*.git*" "*node_modules*" "*dist*"
          (cd dist/packages && sha256sum helix-${TAG}-source.* >> SHA256SUMS.txt)
          sort -u -k2,2 dist/packages/SHA256SUMS.txt -o dist/packages/SHA256SUMS.txt

      - name: Validate all release artifacts
        run: ./scripts/verify-release.sh dist/packages

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          awk "/^## \[${TAG#v}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "${TAG}" \
              dist/packages/* \
              --title "Helix ${TAG}" \
              --notes-file release-notes.md
          else
            gh release create "${TAG}" \
              dist/packages/* \
              --title "Helix ${TAG}" \
              --generate-notes
          fi
