name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 as of 2026-10-09; Dependabot keeps actions/* fresh

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4 as of 2026-10-09
        with:
          node-version: 26.4.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Code quality (ESLint)
        run: npm run lint

      - name: Type checking (TypeScript)
        run: npm run typecheck

      - name: Test suite (TypeScript & ESM)
        run: npm run test

      - name: Living documentation integrity
        run: node --test scripts/doc-paths.test.mjs

      - name: Platform capability matrix verification
        run: node --experimental-strip-types --test src/platforms.test.ts

      - name: CLI smoke test
        run: |
          node cli/helix.mjs --version
          node cli/helix.mjs --help
          node cli/helix.mjs run "Smoke test execution" --dry
