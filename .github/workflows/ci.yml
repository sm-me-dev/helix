name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 as of 2026-10-09; Dependabot keeps actions/* fresh
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master as of 2026-10-07; Dependabot keeps actions/* fresh
        with:
          scandir: ./scripts
          format: gcc
          severity: warning
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 as of 2026-10-09; Dependabot keeps actions/* fresh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 as of 2026-10-09
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
